[project]
name = "citefield"
version = "0.0.1"
description = "Self-hosted document field extraction where every value points to the words it was read from."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = []

[project.scripts]
citefield = "citefield.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
