[project]
name = "citefield"
version = "0.0.1"
description = "Self-hosted document field extraction where every value points to the words it was read from."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "onnxruntime>=1.31.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "rapidocr>=3.10.0",
]

[project.scripts]
citefield = "citefield.cli:main"

[project.optional-dependencies]
eval = [
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pyarrow.*", "reportlab.*", "rapidocr.*"]
ignore_missing_imports = true
